name: Build Runner Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - VERSION
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - VERSION
      - .github/workflows/build.yml

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/atoz-project/arc-runner-rust

jobs:
  build:
    name: Build and push ghcr.io/${{ github.repository_owner }}/arc-runner-rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tag
        id: tags
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.IMAGE }}:v${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard against tag overwrite
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.tags.outputs.version }}" >/dev/null 2>&1
          git_rc=$?
          if [ "$git_rc" -eq 0 ]; then
            echo "::error::git tag v${{ steps.tags.outputs.version }} already exists; bump VERSION" >&2
            exit 1
          elif [ "$git_rc" -ne 2 ]; then
            echo "::error::git ls-remote failed with exit code $git_rc" >&2
            exit 1
          fi
          out="$(docker buildx imagetools inspect "${{ env.IMAGE }}:v${{ steps.tags.outputs.version }}" 2>&1)"
          img_rc=$?
          set -e
          if [ "$img_rc" -eq 0 ]; then
            echo "::error::image tag v${{ steps.tags.outputs.version }} already exists; bump VERSION" >&2
            exit 1
          elif ! printf '%s' "$out" | grep -qiE 'not found|manifest unknown'; then
            echo "::error::imagetools inspect failed unexpectedly: $out" >&2
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Tag the commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.tags.outputs.version }}"
          git push origin "v${{ steps.tags.outputs.version }}"
