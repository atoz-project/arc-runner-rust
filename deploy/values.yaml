# Chart gha-runner-scale-set 0.14.2; minor must match controller 0.14.2.
githubConfigUrl: https://github.com/atoz-project
githubConfigSecret: github-config-secret
runnerGroup: arc-public
minRunners: 1
namespaceOverride: ""
template:
  spec:
    securityContext:
      fsGroup: 1001
    containers:
      - name: runner
        image: ghcr.io/atoz-project/arc-runner-rust:v1.0.0
        command: ["/home/runner/run.sh"]
        volumeMounts:
          - name: cache
            mountPath: /home/runner/.cache
        resources:
          requests: { cpu: "4", memory: 8Gi }
          limits:   { cpu: "4", memory: 8Gi }
    volumes:
      # k8s-sg-dev has no StorageClass or CSIDriver; NAS export 071wrg7528z1wkkb61l (ap-southeast-1a) root is 1777 for uid 1001 writes.
      - name: cache
        nfs:
          server: 071wrg7528z1wkkb61l-fbj64.ap-southeast-1.nas.aliyuncs.com
          path: /
