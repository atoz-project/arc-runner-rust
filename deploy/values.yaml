githubConfigUrl: https://github.com/atoz-project
githubConfigSecret: github-config-secret
runnerGroup: arc-public
minRunners: 1
template:
  spec:
    containers:
      - name: runner
        # tag = 镜像内钉的 rust 版本;升级 = 改这里的 tag + helm upgrade(见 README 升版协议)
        image: ghcr.io/atoz-project/arc-runner-rust:1.98.1
        command: ["/home/runner/run.sh"]
